name: "Freya image"

# Builds this fork's Postiz image on every push to the `freya` branch and publishes it to
# ghcr.io/<owner>/postiz-app:freya (plus :freya-<short sha>). Railway's Postiz service runs that image.
on:
  workflow_dispatch:
  push:
    branches: [freya]

permissions:
  contents: read
  packages: write

concurrency:
  group: freya-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/postiz-app"
          SHORT="${GITHUB_SHA::7}"
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION="freya-${SHORT}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --provenance=false --sbom=false \
            -t "${IMAGE}:freya" -t "${IMAGE}:freya-${SHORT}" \
            --push .
